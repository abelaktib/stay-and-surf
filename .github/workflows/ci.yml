name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit des dépendances (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Tests unitaires et d'intégration
        run: npm test
      - name: Build de production
        run: npm run build
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité
        run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
